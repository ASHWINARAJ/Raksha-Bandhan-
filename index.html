<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Happy Raksha Bandhan!</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #fff8f5;
  --bg2: #ffeef1;
  --accent: #ffb6c1;
  --accent2: #ffd59e;
  --glass: rgba(255,255,255,0.6);
  --card: rgba(255,255,255,0.8);
  --text: #5c4b51;
}
body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: linear-gradient(180deg,var(--bg1), var(--bg2) 80%);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}
.container {
  text-align: center;
}
h1 {
  color: var(--accent2);
  margin-bottom: 10px;
}

/* Envelope base */
.envelope {
  position: relative;
  width: 200px;
  height: 140px;
  background: var(--accent);
  border-radius: 8px;
  cursor: pointer;
  overflow: hidden;
  margin: 0 auto;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.envelope .flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 70%;
  background: var(--accent);
  clip-path: polygon(0 0, 50% 100%, 100% 0);
  transform-origin: top;
  transition: transform 0.6s ease;
  z-index: 2;
}
.envelope.open .flap {
  transform: rotateX(180deg);
}
.envelope .body {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--accent);
  z-index: 1;
}

/* Letter overlay */
.letter-overlay {
  position: fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0.8);
  opacity:0;
  background:var(--bg1);
  border-radius:12px;
  max-width:400px;
  box-shadow:0 20px 100px rgba(255,182,193,0.35);
  transition: all .6s ease;
  text-align:center;
  padding:10px;
  z-index:100;
}
.letter-overlay.show {
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}
.letter-overlay img {
  width:100%;
  border-radius:8px;
}

/* Confetti */
#confetti {
  position:fixed; left:0; top:0; width:100%; height:100%;
  pointer-events:none; z-index:99;
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="container">
  <h1>Happy Raksha Bandhan!</h1>
  <p>Tap the envelope for a surprise 🎁</p>
  <div class="envelope" id="envelopeBtn">
    <div class="flap"></div>
    <div class="body"></div>
  </div>
</div>

<!-- Letter -->
<div class="letter-overlay" id="letter">
  <img src="letter.png" alt="Letter">
</div>

<!-- Audio -->
<audio id="bgAudio" src="music.mp3" preload="auto"></audio>

<script>
/* Confetti setup */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let W = canvas.width = innerWidth;
let H = canvas.height = innerHeight;
const pieces = [];
function rand(min,max){ return Math.random()*(max-min)+min; }
function makePieces(n=80){
  for(let i=0;i<n;i++){
    pieces.push({
      x: rand(0,W),
      y: rand(-H,0),
      r: rand(6,12),
      s: rand(1.2,3.2),
      a: rand(0,Math.PI*2),
      c: ['#ffb6c1','#ffd59e','#fff0f5','#ffcad4','#ffe4e1'][Math.floor(rand(0,5))]
    });
  }
}
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener('resize',resize);
function step(){
  ctx.clearRect(0,0,W,H);
  for(let p of pieces){
    p.y += p.s + Math.sin(p.a)*0.6;
    p.x += Math.cos(p.a)*0.6;
    p.a += 0.03;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.a);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.6);
    ctx.restore();
    if(p.y>H+20){ p.y = rand(-200,-20); p.x = rand(0,W); }
  }
  requestAnimationFrame(step);
}
function startConfetti(){
  makePieces(90);
  step();
  setTimeout(()=>{ pieces.length=0; ctx.clearRect(0,0,W,H); }, 7000);
}

/* Click Event */
document.getElementById('envelopeBtn').addEventListener('click', function(){
  this.classList.add('open');
  const audio = document.getElementById('bgAudio');
  audio.play().catch(()=>console.warn('Autoplay blocked'));
  const letter = document.getElementById('letter');
  setTimeout(()=>{ letter.classList.add('show'); startConfetti(); }, 600);
});
</script>
</body>
</html>
